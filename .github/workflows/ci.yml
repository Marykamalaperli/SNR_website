name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  target-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: snr_nest
          POSTGRES_USER: snr_nest
          POSTGRES_PASSWORD: snr_nest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snr_nest -d snr_nest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://snr_nest:snr_nest_ci@127.0.0.1:5432/snr_nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic downgrade base
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - name: Verify target containers build
        run: |
          docker build --file infra/docker/backend.Dockerfile --tag snr-nest-api:ci .
          docker build --file infra/docker/frontend.Dockerfile --tag snr-nest-frontend:ci .
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL tenant and role isolation
        run: bash scripts/test-supabase.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test ../scripts/deployment.test.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:server
      - run: npm run test
      - run: npm run build
      - name: Compile account-management server
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.158.0 pages functions build functions --outdir .wrangler/worker --compatibility-date 2026-11-07
      - name: Test account creation in the Cloudflare runtime
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes --package=wrangler@4.158.0 -- node scripts/test-worker-runtime.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff check --config pyproject.toml ../scripts/bootstrap_gcp.py
      - run: python -m ruff check --config pyproject.toml ../scripts/test_workspace_concurrency.py
      - run: python -m ruff format --check .
      - run: python -m ruff format --check --config pyproject.toml ../scripts/bootstrap_gcp.py
      - run: python -m ruff format --check --config pyproject.toml ../scripts/test_workspace_concurrency.py
      - run: python -m pytest
      - name: Build backend runtime image
        working-directory: .
        run: docker build --file infra/cloud-run/Dockerfile --tag snr-nest-api:ci .

name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test ../scripts/deployment.test.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff check --config pyproject.toml ../scripts/bootstrap_gcp.py
      - run: python -m ruff format --check .
      - run: python -m ruff format --check --config pyproject.toml ../scripts/bootstrap_gcp.py
      - run: python -m pytest
      - name: Build backend runtime image
        working-directory: .
        run: docker build --file infra/cloud-run/Dockerfile --tag snr-nest-api:ci .

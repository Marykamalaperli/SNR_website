name: Deploy application
on:
  workflow_dispatch:
    inputs:
      target:
        description: Component to deploy (first release should be frontend)
        required: true
        default: frontend
        type: choice
        options:
          - frontend
          - backend
          - both
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  backend:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'backend' || inputs.target == 'both')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: production-backend
      url: ${{ steps.release.outputs.url }}
    outputs:
      url: ${{ steps.release.outputs.url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_BUILD_SOURCE_BUCKET: ${{ vars.GCP_BUILD_SOURCE_BUCKET }}
      GCP_SERVICE: ${{ vars.GCP_SERVICE || 'snr-nest-api' }}
      GCP_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate identity configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo 'Set GCP_WORKLOAD_IDENTITY_PROVIDER.' >&2; exit 1; }
          test -n "$DEPLOY_ACCOUNT" || { echo 'Set GCP_DEPLOY_SERVICE_ACCOUNT.' >&2; exit 1; }
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m ruff check backend
      - run: python -m pytest
        working-directory: backend
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - id: release
        name: Build, deploy and verify API
        run: bash scripts/deploy-cloud-run.sh
  frontend:
    needs: backend
    if: always() && github.ref == 'refs/heads/main' && (inputs.target == 'frontend' || (inputs.target == 'both' && needs.backend.result == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: production-frontend
      url: ${{ steps.project.outputs.site_url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'snr-nest' }}
      WRANGLER_SEND_METRICS: "false"
      VITE_API_BASE_URL: ${{ needs.backend.outputs.url || vars.VITE_API_BASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_AUTH_SESSION_SOURCE: ${{ vars.VITE_AUTH_SESSION_SOURCE || 'supabase' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test deployment guardrails
        run: node --test scripts/deployment.test.mjs
      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run test:server
          npm run test
      - id: project
        name: Verify or create Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node --use-env-proxy scripts/ensure-pages-project.mjs
      - name: Build canonical production site
        working-directory: frontend
        env:
          PUBLIC_SITE_URL: ${{ steps.project.outputs.site_url }}
        run: npm run build
      - name: Test account creation in the Cloudflare runtime
        working-directory: frontend
        run: npx --yes --package=wrangler@4.158.0 -- node scripts/test-worker-runtime.mjs
      - name: Check production routes
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser -- --project=production
      - name: Deploy to Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.158.0 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify public release
        env:
          SITE_URL: ${{ steps.project.outputs.site_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SITE_URL/" | grep -q 'SNR NEST'
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SITE_URL/sitemap.xml" | grep -Fq "$SITE_URL/"
          printf 'Published site: %s\n' "$SITE_URL"

x-backend-environment: &backend-environment
  APP_ENV: production
  PYTHONPATH: /app
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
  SESSION_COOKIE_SECURE: "true"
  QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?QR_SIGNING_SECRET must be set}
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  EVIDENCE_BUCKET_NAME: ${EVIDENCE_BUCKET_NAME:?EVIDENCE_BUCKET_NAME must be set}
  PAYSLIP_BUCKET_NAME: ${PAYSLIP_BUCKET_NAME:?PAYSLIP_BUCKET_NAME must be set}

services:
  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    restart: "no"

  bootstrap-admin:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    command: ["python", "scripts/bootstrap_production_admin.py"]
    environment:
      <<: *backend-environment
      SNR_BOOTSTRAP_ADMIN_EMAIL: ${SNR_BOOTSTRAP_ADMIN_EMAIL:?Admin email must be set}
      SNR_BOOTSTRAP_ADMIN_PASSWORD: ${SNR_BOOTSTRAP_ADMIN_PASSWORD:?Admin password must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment: *backend-environment
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/api/v1/ready', headers={'Host': 'api.snrnest.in'}))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
